version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/platform/android"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/platform/linux"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/platform/android"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
