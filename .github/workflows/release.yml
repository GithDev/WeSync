name: Release Android APK

# Builds a signed release APK and attaches it to a GitHub Release whenever a
# v* tag is pushed. IzzyOnDroid polls these releases to pick up new versions.
#
# Required repository Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    - the release keystore, base64-encoded
#                        (`base64 -w0 release.jks` / on macOS `base64 -i ...`)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias inside the keystore
#   KEY_PASSWORD       - key password
#
# The SAME keystore must be used for every release — IzzyOnDroid (and Android)
# reject an update signed with a different key. Keep it backed up safely.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/attach the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so build.gradle.kts can derive versionCode from the
          # commit count (git rev-list --count HEAD).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage web/dist into mobile/webdist
        # The AAR embeds mobile/webdist (mobile/static.go). The container does
        # NOT build the web itself, so we populate it here first.
        run: |
          rm -rf mobile/webdist
          cp -r web/dist mobile/webdist

      - name: Build toolchain image
        run: docker build -f platform/android/Dockerfile -t wesync-android .

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist/android
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/dist/android:/out" \
            -v "$RUNNER_TEMP/release.jks:/keystore.jks:ro" \
            -e KEYSTORE_PATH=/keystore.jks \
            -e KEYSTORE_PASSWORD \
            -e KEY_ALIAS \
            -e KEY_PASSWORD \
            wesync-android assembleRelease

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/wesync-release.apk
          fail_on_unmatched_files: true
