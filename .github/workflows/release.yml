name: Release

# Builds web once, then Linux / Windows / Android in parallel.
# All platform jobs depend on the web artifact; the release job collects
# everything and publishes to GitHub Releases.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    - Android release keystore, base64-encoded
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias inside the keystore
#   KEY_PASSWORD       - key password

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ── 1. Web UI ────────────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build web UI
        run: make PODMAN=docker VERSION=$VERSION web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  # ── 2a. Linux packages ───────────────────────────────────────────────────────
  linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Build Linux packages
        run: make PODMAN=docker VERSION=$VERSION linux-pkg

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/linux/
          if-no-files-found: error

  # ── 2b. Windows installer ────────────────────────────────────────────────────
  windows:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Build Windows installer
        run: make PODMAN=docker VERSION=$VERSION windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/windows/*.exe
          if-no-files-found: error

  # ── 2c. Android APK ──────────────────────────────────────────────────────────
  android:
    needs: web
    runs-on: ubuntu-latest
    environment: Secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Android APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make PODMAN=docker VERSION=$VERSION android-release

      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/android/wesync-release.apk
          if-no-files-found: error

  # ── 3. Publish release ───────────────────────────────────────────────────────
  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WeSync ${{ github.ref_name }}"
          files: |
            linux-dist/*.deb
            linux-dist/*.rpm
            windows-dist/*.exe
            android-dist/wesync-release.apk
          fail_on_unmatched_files: true
