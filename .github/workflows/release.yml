name: Release

# Builds web once, then Linux / Windows / Android in parallel.
# All platform jobs depend on the web artifact; the release job collects
# everything and publishes to GitHub Releases.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64          - Android release keystore, base64-encoded
#   KEYSTORE_PASSWORD        - keystore password
#   KEY_ALIAS                - key alias inside the keystore
#   KEY_PASSWORD             - key password
#   WINDOWS_CERT_PFX_BASE64  - Windows code-signing certificate (.pfx), base64-encoded
#   WINDOWS_CERT_PASSWORD    - password for the .pfx certificate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ── 0. Tests ─────────────────────────────────────────────────────────────────
  # Runs in parallel with the web build. All platform build jobs depend on both
  # so neither a test failure nor a broken web build can slip into a release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create mobile/webdist stub
        # mobile/static.go embeds all:webdist; the real content is copied in
        # by the android build step. Tests don't serve web content so a minimal
        # stub is enough to satisfy the embed and let the package compile.
        run: mkdir -p mobile/webdist && echo '<!doctype html>' > mobile/webdist/index.html

      - name: Backend tests
        run: go test ./internal/... ./mobile/...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend tests
        working-directory: web
        run: npm ci && npm test

  # ── 1. Web UI ────────────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build web UI
        run: make PODMAN=docker VERSION=$VERSION web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  # ── 2a. Linux packages ───────────────────────────────────────────────────────
  linux:
    needs: [web, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Build Linux packages
        run: make PODMAN=docker VERSION=$VERSION linux-pkg

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/linux/
          if-no-files-found: error

  # ── 2b. Windows installer ────────────────────────────────────────────────────
  windows:
    needs: [web, test]
    runs-on: ubuntu-latest
    environment: Secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Decode code-signing certificate
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: echo "$WINDOWS_CERT_PFX_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/cert.pfx"

      - name: Build signed Windows installer
        env:
          WINDOWS_CERT_PFX: ${{ runner.temp }}/cert.pfx
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: make PODMAN=docker VERSION=$VERSION windows-signed

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/windows/*.exe
          if-no-files-found: error

  # ── 2c. Android APK ──────────────────────────────────────────────────────────
  android:
    needs: [web, test]
    runs-on: ubuntu-latest
    environment: Secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Android APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make PODMAN=docker VERSION=$VERSION android-release

      - name: Rename APK with version
        run: mv dist/android/wesync-release.apk dist/android/wesync-$VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/android/wesync-*.apk
          if-no-files-found: error

  # ── 3. Publish release ───────────────────────────────────────────────────────
  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WeSync ${{ github.ref_name }}"
          files: |
            linux-dist/*.deb
            linux-dist/*.rpm
            windows-dist/*-setup.exe
            android-dist/wesync-*.apk
          fail_on_unmatched_files: true
