name: Release

# Builds all installable artifacts and attaches them to a GitHub Release
# whenever a v* tag is pushed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    - the Android release keystore, base64-encoded
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias inside the keystore
#   KEY_PASSWORD       - key password
#
# The same keystore must be used for every release — Android rejects an update
# signed with a different key. Keep the .jks file backed up safely.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build web UI
        run: make PODMAN=docker VERSION=$VERSION web

      - name: Build Linux packages (.deb + .rpm)
        run: make PODMAN=docker VERSION=$VERSION linux-pkg

      - name: Build Windows installer
        run: make PODMAN=docker VERSION=$VERSION windows

      - name: Build signed Android APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make PODMAN=docker VERSION=$VERSION android-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "WeSync ${{ github.ref_name }}"
          files: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/windows/*.exe
            dist/android/wesync-release.apk
          fail_on_unmatched_files: true
