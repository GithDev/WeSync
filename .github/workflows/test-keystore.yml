name: Test keystore

# Run manually from Actions tab to verify signing works — no full build needed.

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Secrets
    steps:
      - uses: actions/checkout@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Decoded size: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"

      - name: Build Docker image
        run: docker build -f platform/android/Dockerfile -t wesync-android .

      - name: Verify keystore with keytool
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/release.jks:/keystore.jks:ro" \
            --entrypoint keytool wesync-android \
            -list -v \
            -keystore /keystore.jks \
            -storepass '${{ secrets.KEYSTORE_PASSWORD }}'
