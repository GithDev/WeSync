version: 2

before:
  hooks:
    - go mod tidy
    - sh -c "cd web && npm ci && npm run build"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
    main: .

archives:
  - id: default
    name_template: "wesync_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - package_name: wesync
    vendor: WeSync
    description: Sync files between your devices
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: ./wesync
        dst: /usr/local/bin/wesync

checksum:
  name_template: checksums.txt

release:
  draft: true
  replace_existing_draft: true
  name_template: "WeSync {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^docs:"
